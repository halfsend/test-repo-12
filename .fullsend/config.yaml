# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: dummy
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: local-ping
      source: harness/local-ping.yaml
    - name: url-mixed
      source: https://raw.githubusercontent.com/halfsend/test-repo-12-url-harness-host/main/harness/url-mixed.yaml#sha256=3f148664e9c850486215fa476e76ab589de493ed288947a6165a32b63def6392
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://raw.githubusercontent.com/halfsend/test-repo-12-url-harness-host/
create_issues:
    allow_targets:
        repos:
            - fullsend-ai/fullsend
mint_url: https://stage-mint.fullsend.sh
inference:
    project: it-gcp-konflux-e2e-fullsend
    wif_provider: projects/208332380190/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-halfsend-test-repo-12
